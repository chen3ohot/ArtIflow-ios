name: ArtIflow
options:
  bundleIdPrefix: com.studysuit
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
targets:
  ArtIflow:
    type: application
    platform: iOS
    sources:
      - path: ArtIflow
        excludes:
          - "Resources/**"
    resources:
      - path: ArtIflow/Resources
        excludes:
          - "Info.plist"
    info:
      path: ArtIflow/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studysuit.artiflow
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
  ArtIflowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ArtIflowTests
    dependencies:
      - target: ArtIflow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studysuit.artiflow.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ArtIflow:
    build:
      targets:
        ArtIflow: all
        ArtIflowTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ArtIflowTests
