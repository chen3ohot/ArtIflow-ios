name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (iOS)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | head -1)/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: List available simulators
        run: xcrun simctl list devices available | head -40

      - name: Resolve Swift packages
        working-directory: ios
        run: |
          set -o pipefail && \
          xcodebuild -project ArtIflow.xcodeproj -scheme ArtIflow \
            -destination 'generic/platform=iOS Simulator' \
            -resolvePackageDependencies || true

      - name: Build
        working-directory: ios
        run: |
          set -o pipefail && \
          xcodebuild -project ArtIflow.xcodeproj -scheme ArtIflow \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            MARKETING_VERSION="0.0.0-dev" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | xcpretty

      - name: Test
        working-directory: ios
        run: |
          set -o pipefail && \
          xcodebuild -project ArtIflow.xcodeproj -scheme ArtIflow \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            MARKETING_VERSION="0.0.0-dev" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test | xcpretty

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ios/**/*.log
            ios/build/
